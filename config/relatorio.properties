# Propriedades carregadas com -q (complementam o user.properties do JMeter)

# Formato do JTL (lido pelo scripts/avaliar_criterio.py)
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.response_data.on_error=false

# Dashboard HTML
jmeter.reportgenerator.report_title=BlazeDemo - Compra de passagem aerea
jmeter.reportgenerator.overall_granularity=1000
# Apdex alinhado ao criterio (2 s = satisfeito)
jmeter.reportgenerator.apdex_satisfied_threshold=2000
jmeter.reportgenerator.apdex_tolerated_threshold=4000
# Percentis exibidos na tabela Statistics
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# Resumo no console a cada 10 s
summariser.interval=10
